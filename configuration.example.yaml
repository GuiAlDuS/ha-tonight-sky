# Add to configuration.yaml. If you already have a `command_line:` or an
# `automation:` section, add these entries to it.
command_line:
  # Planets and the Moon tonight: computed locally, no internet
  - sensor:
      name: "Tonight sky"
      unique_id: tonight_sky
      icon: mdi:telescope
      command: "python3 /config/tonight_sky/sensors/tonight.py"
      value_template: "{{ value_json.state }}"
      json_attributes:
        - night
        - planets
        - moon
        - upcoming
        - updated
      scan_interval: 3600
      command_timeout: 60
  # Visible satellite passes: computed locally from CelesTrak's orbits (no key)
  - sensor:
      name: "Tonight satellites"
      unique_id: tonight_satellites
      icon: mdi:satellite-variant
      command: "python3 /config/tonight_sky/sensors/satellites.py"
      value_template: "{{ value_json.state }}"
      json_attributes:
        - passes
        - checked
      scan_interval: 7200
      command_timeout: 120
  # Cloud cover per hour: Open-Meteo
  - sensor:
      name: "Tonight clouds"
      unique_id: tonight_clouds
      icon: mdi:weather-night-partly-cloudy
      command: "python3 /config/tonight_sky/sensors/clouds.py"
      value_template: "{{ value_json.state }}"
      unit_of_measurement: "%"
      json_attributes:
        - hours
        - checked
      scan_interval: 3600
      command_timeout: 30
  # Optional: Starlink "trains" (newly launched Starlinks still in a row). Downloads a
  # 5 MB file from CelesTrak three times a day; most weeks there is no train.
  # Leave this block out and the card simply shows no trains.
  - sensor:
      name: "Tonight trains"
      unique_id: tonight_trains
      icon: mdi:satellite-uplink
      command: "python3 /config/tonight_sky/sensors/trains.py"
      value_template: "{{ value_json.state }}"
      json_attributes:
        - passes
        - trains
        - checked
      scan_interval: 7200
      command_timeout: 120

# Recalculate "tonight" at dawn: the sky sensor runs once an hour, so without this
# the card can show the night that just ended for up to an hour after dawn.
automation:
  - alias: "Tonight: recalculate at dawn"
    triggers:
      - trigger: template
        value_template: >-
          {{ (state_attr('sensor.tonight_sky', 'night') or {}).get('end', '9')
             < now().strftime('%Y-%m-%dT%H:%M') }}
    actions:
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.tonight_sky
    mode: single

