 SATC = {\"25544\":\"#ffffff\",\"48274\":\"#e867c3\",\"20580\":\"#44b782\",\"61047\":\"#faa9c1\"}, NAME = {\"mercury\":\"Mercurio\",\"venus\":\"Venus\",\"mars\":\"Marte\",\"jupiter\":\"Júpiter\",\"saturn\":\"Saturno\"}, SATN = {\"25544\":[\"la Estación Espacial\",\"Estación Espacial (ISS)\",\"ISS\"],\"48274\":[\"la estación china Tiangong\",\"Estación china Tiangong\",\"Tiangong\"],\"20580\":[\"el telescopio Hubble\",\"Telescopio Hubble\",\"Hubble\"],\"61047\":[\"el satélite BlueBird\",\"Satélite BlueBird\",\"BlueBird\"]};\n  const DIRS = [\"norte\",\"noreste\",\"este\",\"sureste\",\"sur\",\"suroeste\",\"oeste\",\"noroeste\"], CONS = {\"Ori\":\"Orión\",\"CMa\":\"Can Mayor\",\"Tau\":\"Tauro\",\"Gem\":\"Géminis\",\"Leo\":\"Leo\",\"UMa\":\"Osa Mayor\",\"Cas\":\"Casiopea\",\"Cyg\":\"Cisne\",\"Lyr\":\"Lira\",\"Aql\":\"Águila\",\"Sco\":\"Escorpión\",\"Sgr\":\"Sagitario\",\"Cru\":\"Cruz del Sur\",\"Cen\":\"Centauro\",\"Boo\":\"Boyero\"}, STARN = {\"32349\":\"Sirio\",\"30438\":\"Canopus\",\"69673\":\"Arturo\",\"91262\":\"Vega\",\"24608\":\"Capella\",\"24436\":\"Rigel\",\"37279\":\"Proción\",\"27989\":\"Betelgeuse\",\"97649\":\"Altair\",\"21421\":\"Aldebarán\",\"65474\":\"Espiga\",\"80763\":\"Antares\",\"37826\":\"Pólux\",\"113368\":\"Fomalhaut\",\"102098\":\"Deneb\",\"49669\":\"Régulo\",\"11767\":\"Polar\"}, MOONNAME = \"Luna\";\n  const LAT = hass.config.latitude, LON = hass.config.longitude, R = Math.PI / 180;\n  const attrs = id => (hass.states[id] || {attributes: {}}).attributes;\n  const A = attrs('sensor.tonight_sky'), I = attrs('sensor.tonight_satellites'), C = attrs('sensor.tonight_clouds');\n  const ps = A.planets || [], n = A.night || null, L = A.moon || {};\n  const empty = () => { for (const k of ['sR','sT','sS','sO','cR','cT','cD','nR','nT','nD','qR','qT','qX','iR','iT','iD',\n      'kX','kC','kTxt','kTC','kD','kTV','kTT','TX','tV','tT','bY','bC','bD','bB','bX','lX','lY','lT','eX','eY','eD','eC']) vars[k] = [];\n    vars.slots = []; vars.moon = null; vars.iM = 