    yaxis2:
      domain: '$fn ({vars}) => { const vw = window.innerWidth, phone = vw < 870; const W = phone ? vw - 32 : (vw - 320 - 16) * 12 / 24; const s = Math.min(W - 80, 640), leg = phone ? 126 : 96; const th = 20 * Math.max(1, vars.tN || 0), ph = s + leg + 112 + th; return [(leg + 84) / ph, (leg + 84 + th) / ph]; }'
      anchor: x
